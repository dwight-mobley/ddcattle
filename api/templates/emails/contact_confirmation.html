<div style="font-family: sans-serif; color: #2A2A2A;">
    <h2 style="color: #4A3021;">We received your message!</h2>
    <p>Hi {{ data.name }},</p>
    <p>Thank you for reaching out. We have received your inquiry regarding <strong>{{ data.subject }}</strong> and will get back to you as soon as we can.</p>
    <hr style="border: 0; border-top: 1px solid #899684; margin: 20px 0;">
    <p><strong>Your message:</strong></p>
    <p style="background-color: #F7F5F0; padding: 15px; border-radius: 8px;"><em>{{ data.message }}</em></p>
    <br>
    <p>Best,<br>The Ranch Team</p>
</div>
