<div style="font-family: sans-serif; color: #2A2A2A;">
    <h2 style="color: #4A3021;">New Contact Message</h2>
    <p><strong>From:</strong> {{ data.name }} ({{ data.email }})</p>
    <p><strong>Topic:</strong> <span style="text-transform: capitalize;">{{ data.topic }}</span></p>
    <hr style="border: 0; border-top: 1px solid #899684; margin: 20px 0;">
    <p><strong>Message:</strong></p>
    <p style="background-color: #F7F5F0; padding: 15px; border-radius: 8px;">{{ data.message }}</p>
</div>
