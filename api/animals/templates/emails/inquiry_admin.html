<h2>New inquiry for {{ animal.name }}</h2>
<p><strong>From:</strong> {{ data.sender_name }} ({{ data.sender_email }})</p>
<p><strong>Message:</strong></p>
<p>{{ data.message }}</p>
{% if listing_title %}<p><strong>Listing:</strong> {{ listing_title }}</p>
<p><strong>Status:</strong> {{ listing_status }}</p>
<p><a href="{{ listing_url }}">View the listing</a></p>{% endif %}
{% if data.phone %}<p><strong>Phone:</strong> {{ data.phone }}</p>{% endif %}
